apiVersion: v1
kind: Secret
metadata:
  name: cv-analyzer-secrets
  namespace: cv-analyzer
type: Opaque
stringData:
  # Database password (base64 encoded in production)
  database-password: "postgres123"
  
  # OpenAI API Key (replace with your actual key)
  openai-api-key: "sk-your-openai-api-key-here"
  
  # Gemini API Key (replace with your actual key)
  gemini-api-key: "your-gemini-api-key-here"
  
  # Database connection string
  connection-string: "Host=postgres-service;Database=cv_analyzer;Username=postgres;Password=postgres123"
