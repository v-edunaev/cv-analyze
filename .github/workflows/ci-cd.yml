name: CV Analyzer CI/CD

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'OpenAI' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'test_password' }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore analyze-cv.sln
    
    - name: Build
      run: dotnet build analyze-cv.sln --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test analyze-cv.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./backend/coverage
    
    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: backend/coverage/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'
    
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
    
    - name: Lint C# code
      run: dotnet format analyze-cv.sln --verify-no-changes --verbosity diagnostic
      continue-on-error: true

  frontend-build-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
      continue-on-error: true
    
    - name: Type check
      working-directory: ./frontend
      run: npx tsc --noEmit
      continue-on-error: true
    
    - name: Run tests
      working-directory: ./frontend
      run: npm run test:coverage
    
    - name: Upload frontend coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./frontend/coverage
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
    
    - name: Build
      working-directory: ./frontend
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'OpenAI' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'test_password' }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create .env file for Docker build
      run: |
        cat > .env << EOF
        DB_PASSWORD=${DB_PASSWORD}
        LLM_PROVIDER=${LLM_PROVIDER}
        OPENAI_API_KEY=${OPENAI_API_KEY}
        OPENAI_MODEL=${OPENAI_MODEL}
        GEMINI_API_KEY=${GEMINI_API_KEY}
        GEMINI_MODEL=${GEMINI_MODEL}
        EOF
    
    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: cv-analyzer-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          LLM_PROVIDER=${{ env.LLM_PROVIDER }}
          OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ env.OPENAI_MODEL }}
          GEMINI_API_KEY=${{ env.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ env.GEMINI_MODEL }}
          DB_PASSWORD=${{ env.DB_PASSWORD }}
    
    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: cv-analyzer-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions: write-all

    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner (Backend)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './backend'
        format: 'sarif'
        output: 'trivy-backend-results.sarif'
    
    - name: Upload Trivy backend results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-backend-results.sarif'
        category: 'backend-security'
    
    - name: Run Trivy vulnerability scanner (Frontend)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './frontend'
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'
    
    - name: Upload Trivy frontend results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-frontend-results.sarif'
        category: 'frontend-security'

  lint-dockerfile:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Lint backend Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: backend/Dockerfile
        ignore: DL3008,DL3018
    
    - name: Lint frontend Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: frontend/Dockerfile
        ignore: DL3008,DL3018

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan, lint-dockerfile]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'OpenAI' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create deployment .env file
      run: |
        cat > .env.staging << EOF
        DB_PASSWORD=${DB_PASSWORD}
        LLM_PROVIDER=${LLM_PROVIDER}
        OPENAI_API_KEY=${OPENAI_API_KEY}
        OPENAI_MODEL=${OPENAI_MODEL}
        GEMINI_API_KEY=${GEMINI_API_KEY}
        GEMINI_MODEL=${GEMINI_MODEL}
        EOF
        
    - name: Deploy to staging (placeholder)
      run: |
        echo "Deploying to staging environment..."
        echo "Environment file created with secrets"
        # Add actual deployment commands here
        # e.g., docker-compose up -d, kubectl apply, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan, lint-dockerfile]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'OpenAI' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create production .env file
      run: |
        cat > .env.production << EOF
        DB_PASSWORD=${DB_PASSWORD}
        LLM_PROVIDER=${LLM_PROVIDER}
        OPENAI_API_KEY=${OPENAI_API_KEY}
        OPENAI_MODEL=${OPENAI_MODEL}
        GEMINI_API_KEY=${GEMINI_API_KEY}
        GEMINI_MODEL=${GEMINI_MODEL}
        EOF
        
    - name: Deploy to production (placeholder)
      run: |
        echo "Deploying to production environment..."
        echo "Environment file created with secrets"
        # Add actual deployment commands here
        # e.g., docker-compose up -d, kubectl apply, etc.
